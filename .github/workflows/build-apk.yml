name: Build EV Diagnostic Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ─── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ─── 2. Java 17 ────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ─── 3. Download gradle-wrapper.jar ────────────────────────
      - name: Download Gradle Wrapper JAR
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL \
            "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar
          echo "✅ gradle-wrapper.jar: $(du -h gradle/wrapper/gradle-wrapper.jar | cut -f1)"

      # ─── 4. Make gradlew executable ────────────────────────────
      - name: Make gradlew executable
        run: chmod +x gradlew

      # ─── 5. Cache Gradle ───────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ─── 6. Verify HTML asset ──────────────────────────────────
      - name: Verify HTML asset
        run: |
          FILE=app/src/main/assets/index.html
          if [ -f "$FILE" ]; then
            echo "✅ index.html found — $(du -h $FILE | cut -f1)"
          else
            echo "❌ index.html NOT FOUND"
            exit 1
          fi

      # ─── 7. Build Debug APK (ไม่ต้อง keystore) ────────────────
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      # ─── 8. Show APK info ──────────────────────────────────────
      - name: Show APK info
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "✅ APK size: $(du -h $APK | cut -f1)"

      # ─── 9. Upload Debug APK ───────────────────────────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ev-diagnostic-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
