plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mqsquare.evdiagnosticweb'
    compileSdk 34

    defaultConfig {
        applicationId "com.mqsquare.evdiagnosticweb"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    aaptOptions {
        noCompress 'html', 'js', 'css'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.10.0'
}
